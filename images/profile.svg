    <path d="M58 90 C52 52 76 28 108 30 C132 32 144 50 140 68 C130 56 116 52 100 54 C86 54 78 62 76 78 L74 98 C66 98 60 96 58 90 Z" fill="#6a6dc4"/>
    <!-- full beard -->
    <path d="M70 92 C72 86 80 86 84 94 C90 106 108 106 124 100 C130 100 136 104 140 108 C148 112 150 124 144 140 C138 158 118 166 98 164 C76 162 62 146 62 124 C62 110 64 98 70 92 Z" fill="#6a6dc4"/>
    <!-- grey streaks -->
    <path d="M78 118 C82 138 94 152 110 158 C98 148 90 134 88 116 Z" fill="#cfd0ec"/>
    <path d="M112 124 C116 138 124 148 134 150 C128 142 122 134 120 122 Z" fill="#cfd0ec"/>
